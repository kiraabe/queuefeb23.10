services:
  - type: web
    name: fusion-starter
    env: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node scripts/start.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048 --disable-warnings
      - key: VITE_CHUNK_SIZE
        value: "512"
